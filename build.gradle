plugins {
    id "java-library"
    id "net.neoforged.moddev" version "2.0.148"
    id "idea"
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    maven { name = "AliyunCentral"; url = "https://maven.aliyun.com/repository/central" }
    mavenCentral()
}
neoForge {
    version = project.neo_version
    runs {
        client { client(); programArguments.addAll "--username", project.dev_username }
        server { server(); programArgument "--nogui" }
        data {
            data()
            programArguments.addAll "--mod", project.mod_id, "--all", "--output", file("src/generated/resources").absolutePath, "--existing", file("src/main/resources").absolutePath
        }
        configureEach {
            systemProperty "forge.logging.markers", "REGISTRIES"
            logLevel = org.slf4j.event.Level.INFO
        }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
dependencies {
    compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    runtimeOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    // AE2 already requires GuideME at runtime; expose its cached public API for the guide button.
    compileOnly "org.appliedenergistics:guideme:21.1.1"
    // Optional integration API only. The locally supplied mod is not bundled or required at runtime.
    compileOnly files('.dependency-cache/compile-only/mysticalagriculture-1.21.1-8.0.28.jar')
    compileOnly files('.dependency-cache/compile-only/jei-1.21.1-neoforge-19.57.0.449.jar')
    // Optional fusion API; installed runtime mods remain in run/mods, not bundled.
    compileOnly files('.dependency-cache/compile-only/draconic-evolution-1.21.1-3.1.4.633.jar')
    compileOnly files('.dependency-cache/compile-only/brandonscore-1.21.1-3.2.1.309.jar')
    // Optional bee-fishing API; no Productive Bees runtime dependency or bundled classes.
    compileOnly files('.dependency-cache/compile-only/productivebees-1.21.1-13.14.0.jar')
    // Read optional APIs from the user's existing runtime mods; never bundle them.
    compileOnly fileTree('run/mods') { include '*Mekanism-1.21.1-10.7.19.85.jar', '*AppliedFlux-1.21-2.1.7-neoforge.jar' }
    // Isolated optional CPU batch bridges; only read the installed APIs.
    compileOnly fileTree('run/mods') { include 'omnisequence-transfinite-2.0.11.jar', 'neoecoae-21.2.13.jar', 'thunderbolt-2.0.3.jar', '*ae2lt-2.1.3.jar' }
    // Optional Trinity dispatch API, read directly from the installed mod without copying or bundling it.
    compileOnly fileTree('run/mods') { include 'data_energistics-1.21.1-3.4.0-SNAPSHOT+20261030-080125-9f8352a.jar' }
    // Optional wireless pattern terminal; the integration is only loaded when WTLib itself is installed.
    compileOnly fileTree('run/mods') { include '*ae2wtlib-19.5.1.jar' }
}
sourceSets.main.resources.srcDir "src/generated/resources"
def metadataProperties = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_license: mod_license, mod_authors: mod_authors, minecraft_version: minecraft_version, neo_version: neo_version]
tasks.named("processResources", ProcessResources) {
    inputs.properties metadataProperties
    filesMatching("META-INF/neoforge.mods.toml") { expand metadataProperties }
}
tasks.withType(JavaCompile).configureEach { options.encoding = "UTF-8" }
idea.module { downloadSources = true; downloadJavadoc = false }
tasks.named("wrapper", Wrapper) {
    gradleVersion = "8.10.2"
    distributionType = Wrapper.DistributionType.BIN
    distributionUrl = "https://mirrors.huaweicloud.com/gradle/gradle-8.10.2-bin.zip"
    distributionSha256Sum = "31c55713e40233a8303827ceb42ca48a47267a0ad4bab9177123121e71524c26"
}
// HTTPS-fetched fallback artifacts; use this cache before remote repositories.
def projectDependencyCache = repositories.maven {
    name = "ProjectDependencyCache"
    url = uri(".dependency-cache/maven")
    metadataSources { gradleMetadata(); mavenPom(); artifact() }
}
repositories.remove(projectDependencyCache)
repositories.addFirst(projectDependencyCache)
// ModDevGradle adds repositories during plugin application; reorder explicitly.
def chinaMirror = repositories.getByName('AliyunCentral')
repositories.remove(chinaMirror)
repositories.addFirst(chinaMirror)
repositories.remove(projectDependencyCache)
repositories.addFirst(projectDependencyCache)
